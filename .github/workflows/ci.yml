name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build ReentrySync Mod (netstandard2.1)
        run: dotnet build src/ReentrySync/ReentrySync.csproj -c Release -p:CI=true

      - name: Build Dedicated Relay Server (net10.0)
        run: dotnet build src/ReentrySyncServer/ReentrySyncServer.csproj -c Release
